[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-cardinality-governor"
version = "0.1.0"
description = "Approval-gated telemetry cardinality control with Temporal and measured Prometheus canaries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Siva Babu"}]
dependencies = [
  "temporalio>=1.34,<2", "fastapi>=0.143,<1", "uvicorn>=0.54,<1",
  "httpx>=0.28,<1", "prometheus-client>=0.26,<1", "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<1"]

[project.scripts]
governor = "governor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governor = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: exercises a real Temporal server", "e2e: exercises a real local Temporal and Prometheus stack"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/illustrate.py" = ["E501"]
