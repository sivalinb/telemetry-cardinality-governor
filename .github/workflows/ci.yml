name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - name: Fetch verified official binaries
        run: governor fetch-binaries
      - name: Unit, Temporal, replay and real data-plane tests
        env:
          GOVERNOR_RUN_E2E: '1'
        run: pytest -q --junitxml=test-results/pytest.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Validate the packaged stack
        run: python scripts/compose_smoke.py
      - name: Container diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
