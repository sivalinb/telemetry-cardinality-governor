<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="715" viewBox="0 0 1400 715" role="img" aria-label="architecture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d9680"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f2"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="46" y="62" fill="#17392c" font-size="33" font-weight="600">A policy control plane around real telemetry</text><text x="47" y="96" fill="#7c9788" font-size="18" font-weight="400">Temporal coordinates decisions. Prometheus remains the ingestion and query engine.</text><rect x="46" y="148" width="335" height="156" rx="18" fill="white" stroke="#dce7dd"/><text x="69" y="187" fill="#17392c" font-size="22" font-weight="600">Dashboard + API</text><text x="69" y="224" fill="#7c9788" font-size="15" font-weight="400">Review evidence and exact YAML</text><text x="69" y="251" fill="#7c9788" font-size="15" font-weight="400">Approve or reject one workflow</text><text x="69" y="278" fill="#7c9788" font-size="15" font-weight="400">Export Temporal history</text><rect x="494" y="148" width="384" height="156" rx="18" fill="white" stroke="#dce7dd"/><text x="517" y="187" fill="#17392c" font-size="22" font-weight="600">Temporal service + worker</text><text x="517" y="224" fill="#7c9788" font-size="15" font-weight="400">Durable approval windows and timers</text><text x="517" y="251" fill="#7c9788" font-size="15" font-weight="400">Activity retries and history replay</text><text x="517" y="278" fill="#7c9788" font-size="15" font-weight="400">Canary / promotion / compensation</text><rect x="991" y="148" width="363" height="156" rx="18" fill="white" stroke="#dce7dd"/><text x="1014" y="187" fill="#17392c" font-size="22" font-weight="600">Prometheus</text><text x="1014" y="224" fill="#7c9788" font-size="15" font-weight="400">Bounded read-only evidence queries</text><text x="1014" y="251" fill="#7c9788" font-size="15" font-weight="400">Metric relabel rules before ingestion</text><text x="1014" y="278" fill="#7c9788" font-size="15" font-weight="400">Fresh scrape and coverage checks</text><path d="M384,222 L489,222" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><text x="391" y="204" fill="#237b50" font-size="13" font-weight="400">Updates</text><path d="M881,222 L987,222" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><text x="897" y="204" fill="#237b50" font-size="13" font-weight="400">Activities</text><path d="M1174,307 L1174,365" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="905" y="376" width="145" height="102" rx="12" fill="#edf3e6" stroke="#dbe5d4"/><text x="918" y="409" fill="#237b50" font-size="12" font-weight="700">CONTROL</text><text x="918" y="440" fill="#7c9788" font-size="10" font-weight="400">Unfiltered reference</text><rect x="1060" y="376" width="145" height="102" rx="12" fill="#e7f4e8" stroke="#dbe5d4"/><text x="1073" y="409" fill="#237b50" font-size="12" font-weight="700">CANARY</text><text x="1073" y="440" fill="#7c9788" font-size="10" font-weight="400">Approved rule first</text><rect x="1215" y="376" width="145" height="102" rx="12" fill="#faf1e2" stroke="#dbe5d4"/><text x="1228" y="409" fill="#237b50" font-size="12" font-weight="700">PRODUCTION</text><text x="1228" y="440" fill="#7c9788" font-size="10" font-weight="400">Promote after checks</text><rect x="46" y="379" width="727" height="119" rx="18" fill="#eef3e8" stroke="#dce7dd"/><text x="70" y="415" fill="#17392c" font-size="21" font-weight="600">Durable configuration journal + UI projection</text><text x="70" y="450" fill="#7c9788" font-size="16" font-weight="400">SQLite • before-image • atomic rename • operation IDs • exclusive owner</text><path d="M685,307 L685,373" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="46" y="554" width="1308" height="119" rx="18" fill="#173b28" stroke="#173b28"/><text x="70" y="594" fill="#a6edcc" font-size="17" font-weight="600">ONE SYNTHETIC EXPORTER, THREE REAL SCRAPE JOBS</text><text x="70" y="634" fill="#b6d0b9" font-size="21" font-weight="400">The same workload feeds all pools. Real ingestion rules create the measured series difference.</text><path d="M1174,485 L1174,547" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>