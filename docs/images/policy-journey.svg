<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="556" viewBox="0 0 1400 556" role="img" aria-label="policy-journey"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d9680"/></marker></defs><rect width="100%" height="100%" fill="#f5f8f2"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="42" y="61" fill="#17392c" font-size="33" font-weight="600">One approval. Two measured verification gates.</text><text x="42" y="96" fill="#7c9788" font-size="18" font-weight="400">Detection, analysis, rejection and approval expiry do not modify configuration.</text><rect x="42" y="150" width="239" height="190" rx="18" fill="white" stroke="#dce7dd"/><rect x="62" y="171" width="38" height="33" rx="9" fill="#e6f1e1" stroke="#e6f1e1"/><text x="69" y="194" fill="#237b50" font-size="14" font-weight="600">01</text><text x="62" y="240" fill="#17392c" font-size="25" font-weight="600">Analyze</text><text x="62" y="279" fill="#237b50" font-size="17" font-weight="500">1,617 &gt; 400</text><text x="62" y="311" fill="#7c9788" font-size="13" font-weight="400">request_id: 1,600 values</text><path d="M284,243 L305,243" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="311" y="150" width="239" height="190" rx="18" fill="white" stroke="#dce7dd"/><rect x="331" y="171" width="38" height="33" rx="9" fill="#e6f1e1" stroke="#e6f1e1"/><text x="338" y="194" fill="#237b50" font-size="14" font-weight="600">02</text><text x="331" y="240" fill="#17392c" font-size="25" font-weight="600">Review</text><text x="331" y="279" fill="#237b50" font-size="17" font-weight="500">Exact metric drop</text><text x="331" y="311" fill="#7c9788" font-size="13" font-weight="400">Approve / reject / expire</text><path d="M553,243 L574,243" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="580" y="150" width="239" height="190" rx="18" fill="white" stroke="#dce7dd"/><rect x="600" y="171" width="38" height="33" rx="9" fill="#e6f1e1" stroke="#e6f1e1"/><text x="607" y="194" fill="#237b50" font-size="14" font-weight="600">03</text><text x="600" y="240" fill="#17392c" font-size="25" font-weight="600">Canary</text><text x="600" y="279" fill="#237b50" font-size="17" font-weight="500">1,617 → 17</text><text x="600" y="311" fill="#7c9788" font-size="13" font-weight="400">3 passing observations</text><path d="M822,243 L843,243" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="849" y="150" width="239" height="190" rx="18" fill="white" stroke="#dce7dd"/><rect x="869" y="171" width="38" height="33" rx="9" fill="#e6f1e1" stroke="#e6f1e1"/><text x="876" y="194" fill="#237b50" font-size="14" font-weight="600">04</text><text x="869" y="240" fill="#17392c" font-size="25" font-weight="600">Promote</text><text x="869" y="279" fill="#237b50" font-size="17" font-weight="500">Apply same rule</text><text x="869" y="311" fill="#7c9788" font-size="13" font-weight="400">Lab production job</text><path d="M1091,243 L1112,243" fill="none" stroke="#6d9680" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1118" y="150" width="239" height="190" rx="18" fill="white" stroke="#dce7dd"/><rect x="1138" y="171" width="38" height="33" rx="9" fill="#e6f1e1" stroke="#e6f1e1"/><text x="1145" y="194" fill="#237b50" font-size="14" font-weight="600">05</text><text x="1138" y="240" fill="#17392c" font-size="25" font-weight="600">Verify</text><text x="1138" y="279" fill="#237b50" font-size="17" font-weight="500">Keep or restore</text><text x="1138" y="311" fill="#7c9788" font-size="13" font-weight="400">Coverage + error ratio</text><rect x="42" y="391" width="1316" height="121" rx="18" fill="#faf1e3" stroke="#e9d9bd"/><text x="66" y="428" fill="#966529" font-size="23" font-weight="600">Failed canary or production guardrails restore the journaled configuration.</text><text x="66" y="468" fill="#a18456" font-size="20" font-weight="400">Canary failure: 16% errors exceed a 3% guardrail → restore → no promotion.</text></g></svg>